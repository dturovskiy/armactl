name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web]" build

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest

      - name: Build
        run: python -m build

      - name: Installed wheel smoke
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          armactl --help >/dev/null
          python -c "import json; from armactl import installer, service_manager; assert json.loads(installer.render_default_config(rcon_password='test-rcon', password_admin='test-admin'))['game']['maxPlayers'] == 64; assert service_manager.render_start_script(instance_root='/srv/i', server_dir='/srv/i/server', config_dir='/srv/i/config', config_file='/srv/i/config/config.json').startswith('#!/usr/bin/env bash')"
