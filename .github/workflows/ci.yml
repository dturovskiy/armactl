name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web]" build

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        id: pytest
        run: |
          set -o pipefail
          pytest --tb=short -ra 2>&1 | tee pytest-ci.log

      - name: Publish pytest failure summary
        if: failure() && steps.pytest.outcome == 'failure'
        run: |
          {
            echo '## Pytest failure tail'
            echo '```text'
            tail -n 120 pytest-ci.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: python -m build
