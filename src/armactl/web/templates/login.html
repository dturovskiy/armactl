{% extends "layout.html" %}
{% block title %}Login - armactl web{% endblock %}
{% block heading %}Login{% endblock %}
{% block content %}
<section class="auth-panel">
  {% if not owner_configured %}
    <p class="notice">{{ owner_not_configured_message }}</p>
  {% else %}
    {% if error %}
      <p class="notice error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ login_csrf_token }}">
      <label>
        <span>Username</span>
        <input name="username" value="{{ username }}" autocomplete="username" required>
      </label>
      <label>
        <span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Log in</button>
    </form>
  {% endif %}
</section>
{% endblock %}
